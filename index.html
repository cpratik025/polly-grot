<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
    <title>PollyGrot - Language Translation App</title>
</head>
<body>
    <nav>
        <div class="nav-container">
            <img src="./images/worldmap.png" id="main-img" alt="logo">
            <img src="./images/parrot.png" id="parrot-img" alt="logo">
            <h1 class="app-title">PollyGrot <br \><span class="sub-title">Language Translation App</span></h1>
        </div>
    </nav>
    <main>
        <div class="main-container">
            <div class="input-container">
                <h1 class="input-title">Text to translate</h1>
                <textarea id="input-text" placeholder="How are you?"></textarea>
            </div>
            <div class="language-select" id="language-select">
                <h1 class="select-title">Select language</h1>
                <div class= "language-options">
                    <div class="lang-container">
                        <input type="radio" id="fr" class="language-option" name="language" value="franch" checked>
                        <label for="fr">French <img class="flag-img"src="./images/fr-flag.png"></label>
                    </div>
                    <div class="lang-container">
                        <input type="radio" id="es" class="language-option" name="language" value="spanish">
                        <label for="es">Spanish <img class="flag-img"src="./images/sp-flag.png"></label>
                    </div>
                    <div class="lang-container">
                        <input type="radio" id="ja" class="language-option" name="language" value="japanese">
                        <label for="ja">Japanese <img class="flag-img"src="./images/jpn-flag.png"></label>
                    </div>
                </div>
            </div>
            <div class="btn-container" id="btn-container">
                <button class="btn" id="translate-btn">Translate</button>
                <button class="btn" id="start-chat">Start Chat</button>
            </div>
        </div>
    </main>
</body>
<script type="module" src="index.js"></script>
</html>
